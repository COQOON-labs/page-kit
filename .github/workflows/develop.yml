name: Develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check version changes
        id: version
        run: |
          # This script checks if there are version-affecting commits
          # but doesn't actually create a release
          npx semantic-release --dry-run

          if [ $? -eq 0 ]; then
            echo "Version change detected! A new release would be created when merged to main."
            echo "has_version_change=true" >> $GITHUB_OUTPUT
          else
            echo "No version change detected."
            echo "has_version_change=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with version info
        if: github.event_name == 'pull_request' && steps.version.outputs.has_version_change == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔄 This PR contains changes that would trigger a new version release when merged to main.'
            })
